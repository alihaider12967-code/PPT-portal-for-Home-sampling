<style>

</style></head>
<body>
<header><h1>Home Sampling Portal</h1>

</header>

 <div class="row"><label>Month</label><select id="uy"></select> <select id="umn"></select></div>

 <div class="row"><button class="btn" id="rd">Read files</button><span class="msg">Any one file can be uploaded on its own; the others stay as they were.</span></div></div>
 <div id="pv"></div>
</section>

</main>

<script src="lib/pptxgen.bundle.js"></script>
<script src="data.js"></script>
<script>
const MET=[["Efficiency",.85],["On Time",.90],["Online",.90],["Pin Accuracy",.98],["Hotspot",.85],["On-Site (25m)",.80],["POS",.30],["Auto Assignment",0],["Outsource",0]];
const REG=["Lahore","South","Center","North","DHA"],GO=[0,1,2,4,3,8,5,6,7],BO=[0,1,2,3,7,6,4,5];
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const lab=k=>k?MN[+k.slice(5)-1]+"-"+k.slice(2,4):"";
const pc=v=>v==null?"–":(v*100).toFixed(1)+"%";
const $=s=>document.querySelector(s);
let DB={},S={tab:"dash",reg:"Lahore",bm:null,ca:null,cb:null,gm:null,gk:null,rk:null,gt:GO.map(String),rt:BO.map(String),vw:"c",cht:"b",cq:[],ct:BO.map(String),rr:REG.slice(),mm:BO.map(String),fo:true,rg:["Lahore"],op:{}},PEND=null,db=null;
const allv=id=>({bm:keys(),gk:keys(),rk:keys(),ca:keys(),cb:keys(),cq:qy().map(q=>q.id),gt:GO.map(String),rr:REG.slice(),rg:REG.slice()}[id]||BO.map(String));

const qsel=id=>`<select data-q="${id}"><option value="">Select…</option>`+qy().map(q=>`<option value="${q.id}">${q.n}</option>`).join("")+"</select>";
const gname=a=>{if(!a.length)return"–";const q=qy().find(q=>q.ks.length==a.length&&q.ks.every(k=>a.includes(k)));return q?q.n:(a.length<=3?a.map(lab).join("+"):lab(a[0])+"…"+lab(a[a.length-1]))};
const ms=(id,t,items,sel)=>`<details class="ms" data-o="${id}"${S.op[id]?" open":""}><summary>${t} (${sel.length})</summary><div class="mb"><div class="mt"><button data-ma="${id}|all">All</button><button data-ma="${id}|none">None</button></div>`+items.map(([v,n])=>`<label><input type="checkbox" data-ms="${id}" value="${v}"${sel.includes(v)?" checked":""}>${n}</label>`).join("")+"</div></details>";
const keys=()=>Object.keys(DB).sort();
const val=(k,r,i)=>{const x=DB[k]&&DB[k].r&&DB[k].r[r]&&DB[k].r[r].k;return x&&x[i]!=null?x[i]:null};
const avg=(ks,r,i)=>{const a=ks.map(k=>val(k,r,i)).filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const opts=(sel,withBlank)=>(withBlank?'<option value="">—</option>':'')+keys().map(k=>`<option value="${k}"${k==sel?" selected":""}>${lab(k)}</option>`).join("");
const dsel=(p,v)=>`<select data-k="${p}">${opts(v,1)}</select>`;
function gauge(n,v,t){const c=v==null?"var(--tr)":v>=t?"var(--g)":"var(--r)",L=251.3;
return `<div class="c${v!=null&&v<t?" bad":""}"><b>${n}</b><svg viewBox="0 0 100 100"><circle class="rb" cx="50" cy="50" r="40"/><circle class="rv" cx="50" cy="50" r="40" stroke="${c}" stroke-dasharray="${(L*(v||0)).toFixed(1)} ${L}" transform="rotate(-90 50 50)"/><text class="gt" x="50" y="56" fill="${c}">${pc(v)}</text></svg><small>Target ≥ ${t?Math.round(t*100)+"%":"–"}</small></div>`}
function card(n,vals,labs,t,nh){const nn=vals.filter(x=>x!=null),last=nn.length?nn[nn.length-1]:null,mx=Math.max(...nn,t,.01)*1.15,W=Math.max(240,40+vals.length*36),w=(W-40)/vals.length,bw=Math.min(34,w*.7);
let s=vals.map((v,i)=>{if(v==null)return`<text class="ml" x="${20+w*i+w/2}" y="112">${labs[i]}</text>`;const h=v/mx*74,x=20+w*i+(w-bw)/2,c=v>=t?"var(--g)":"var(--r)";
return`<rect x="${x}" y="${96-h}" width="${bw}" height="${h}" fill="${c}" rx="2"/><text class="bl" x="${x+bw/2}" y="${92-h}">${pc(v)}</text><text class="ml" x="${x+bw/2}" y="109">${labs[i]}</text>`}).join("");
return`<div class="c${!nh&&last!=null&&last<t?" bad":""}"><b>${n}</b>${nh?"":`<div class="big">${pc(last)}</div>`}<small>Target ≥ ${t?Math.round(t*100)+"%":"–"}</small><svg viewBox="0 0 ${W} 118">${s}</svg></div>`}
const RC={Lahore:"#2f6fdb",South:"#e08a1e",Center:"#8e44ad",North:"#16a085",DHA:"#d6336c"};
function ring(v,t,l){const c=v==null?"var(--tr)":v>=t?"var(--g)":"var(--r)",L=251.3;return`<div class="mg"><svg viewBox="0 0 100 100"><circle class="rb" cx="50" cy="50" r="40"/><circle class="rv" cx="50" cy="50" r="40" stroke="${c}" stroke-dasharray="${(L*(v||0)).toFixed(1)} ${L}" transform="rotate(-90 50 50)"/><text class="gt" x="50" y="56" fill="${c}">${pc(v)}</text></svg><small>${l}</small></div>`}
function gcard(n,it,t){return`<div class="c${it.length>2?" w2":""}"><b>${n}</b><div class="mgs">${it.map(x=>ring(x.v,t,x.r)).join("")}</div><small>Target ≥ ${t?Math.round(t*100)+"%":"–"}</small></div>`}
function mcard(n,labs,ser,t){if(ser.length==1)return card(n,ser[0].v,labs,t);
const ns=ser.length,nl=labs.length,W=Math.max(240,40+nl*ns*26),gw=(W-40)/nl,bw=Math.min(28,gw*.85/ns),al=ser.flatMap(q=>q.v).filter(x=>x!=null),mx=Math.max(...al,t,.01)*1.15,ty=96-t/mx*74;
let s=labs.map((lb,gi)=>ser.map((q,j)=>{const v=q.v[gi];if(v==null)return"";const h=v/mx*74,x=20+gi*gw+(gw-ns*bw)/2+j*bw;return`<rect x="${x}" y="${96-h}" width="${bw-1}" height="${h}" fill="${v>=t?"var(--g)":"var(--r)"}" rx="2"/><text class="bl" x="${x+bw/2}" y="${92-h}" style="font-size:7px;fill:${v>=t?"var(--g)":"var(--r)"}">${pc(v)}</text><text class="ml" x="${x+bw/2}" y="104" style="font-size:6px">${q.n.slice(0,3)}</text>`}).join("")+`<text class="ml" x="${20+gi*gw+gw/2}" y="117" style="font-size:10px">${lb}</text>`).join("");
if(t)s+=`<line x1="14" x2="${W-14}" y1="${ty}" y2="${ty}" stroke="var(--mu)" stroke-dasharray="3 3"/>`;
return`<div class="c${nl*ns>6?(nl*ns>14?" w3":" w2"):""}"><b>${n}</b><div class="lg">${ser.map(q=>`<span><b>${q.n.slice(0,3)}</b> = ${q.n}</span>`).join("")}</div><small>Target ≥ ${t?Math.round(t*100)+"%":"–"} (dashed line) · bar green = on target, red = below</small><svg viewBox="0 0 ${W} 124">${s}</svg></div>`}
function lcard(n,labs,ser,t){const ns=ser.length,nl=labs.length,multi=ns>1,W=Math.max(240,60+nl*46)+(multi?50:0),al=ser.flatMap(q=>q.v).filter(x=>x!=null);if(!al.length)return mcard(n,labs,ser,t);
let lo=Math.min(...al,t||1),hi=Math.max(...al,t||0);if(hi-lo<.02){lo-=.02;hi+=.02}const pd=(hi-lo)*.25;lo-=pd;hi+=pd;
const X=i=>30+(W-(multi?110:60))*(nl==1?.5:i/(nl-1)),Y=v=>100-(v-lo)/(hi-lo)*76,sv=ser[0].v.filter(x=>x!=null),last=sv.length?sv[sv.length-1]:null;let s="";
if(t)s+=`<line x1="20" x2="${W-20}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--mu)" stroke-dasharray="3 3"/>`;
ser.forEach(q=>{const c=multi?RC[q.n]:"var(--mu)",d=q.v.map((v,i)=>v==null?null:X(i)+","+Y(v)).filter(Boolean).join(" ");s+=`<polyline points="${d}" fill="none" stroke="${c}" stroke-width="1.6"/>`;
q.v.forEach((v,i)=>{if(v==null)return;const g=v>=t;s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" style="fill:${g?"var(--g)":"var(--r)"}"><title>${q.n} ${labs[i]} ${pc(v)}</title></circle>`+(multi?"":`<text class="bl" x="${X(i)}" y="${Y(v)-6}" style="font-size:7px;fill:${g?"var(--g)":"var(--r)"}">${pc(v)}</text>`)})});if(multi){let ends=ser.map(q=>{let k=q.v.length-1;while(k>=0&&q.v[k]==null)k--;return k<0?null:{q,k,y:Y(q.v[k])}}).filter(Boolean).sort((a,b)=>a.y-b.y);for(let j=1;j<ends.length;j++)if(ends[j].y-ends[j-1].y<8)ends[j].y=ends[j-1].y+8;ends.forEach(e=>{s+=`<text class="bl" x="${X(e.k)+8}" y="${e.y+3}" style="font-size:7px;text-anchor:start;fill:${RC[e.q.n]}">${e.q.n.slice(0,3)} ${pc(e.q.v[e.k])}</text>`})}
s+=labs.map((l,i)=>`<text class="ml" x="${X(i)}" y="117" style="font-size:9px">${l}</text>`).join("");
return`<div class="c${nl>5?" w2":""}${!multi&&last!=null&&last<t?" bad":""}"><b>${n}</b>${multi?`<div class="lg">${ser.map(q=>`<span><i style="background:${RC[q.n]}"></i>${q.n}</span>`).join("")}</div>`:`<div class="big">${pc(last)}</div>`}<small>Target ≥ ${t?Math.round(t*100)+"%":"–"} (dashed line) · point green = on target, red = below · end labels show the last month (hover a point for its value)</small><svg viewBox="0 0 ${W} 124">${s}</svg></div>`}
function dash(){const K=keys();if(!K.length){$("#s-dash").innerHTML='<p class="msg">No data yet. Use the Upload tab to add a month.</p>';return}
if(!S.gm){S.gm=K[K.length-1];S.bm=[];S.cb=[];S.ca=[];S.gk=[S.gm];S.rk=[]}
const bm=S.bm.filter(Boolean).sort(),ca=S.ca.filter(Boolean).sort(),cb=S.cb.filter(Boolean).sort(),BF=BO.filter(i=>S.mm.includes(String(i))),CF=BO.filter(i=>S.ct.includes(String(i))),V=vis();
const gk=S.gk.filter(Boolean).sort();let h=`<div class="row"><button class="btn" data-ppt="one">Create PPT</button><span class="msg">Selected regions, only the sections you have filtered, plus data tables.</span></div>`;const RS0=REG.filter(g=>S.rg.includes(g));const secs=RS=>{let h="";if(V.ov&&RS.length)h+=`<h2>Overall (gauges)</h2><p class="msg">Regions: ${RS.join(", ")||"–"}</p><div class="grid">`+GO.filter(i=>S.gt.includes(String(i))).map(i=>RS.length==1?gauge(MET[i][0],avg(gk,RS[0],i),MET[i][1]):gcard(MET[i][0],RS.map(r=>({r,v:avg(gk,r,i)})),MET[i][1])).join("")+`</div><p class="msg">${gk.length>1?"Average of "+gk.map(lab).join(", "):""}</p>`;
if(V.mw&&RS.length)h+=`<h2>Month-wise</h2><div class="grid">`+BF.map(i=>(S.cht=="l"?lcard:mcard)(MET[i][0],bm.map(lab),RS.map(r=>({n:r,v:bm.map(k=>val(k,r,i))})),MET[i][1])).join("")+"</div>";
const QS=qy().filter(q=>S.cq.includes(q.id));
if(V.cp&&RS.length)h+=`<h2>Compare averages (quarter-wise)</h2><div class="grid">`+CF.map(i=>(S.cht=="l"?lcard:mcard)(MET[i][0],QS.map(q=>q.n),RS.map(r=>({n:r,v:QS.map(q=>avg(q.ks,r,i))})),MET[i][1])).join("")+`</div><p class="msg">Each bar = simple average of the months in that period: ${QS.map(q=>q.n+" ("+q.ks.map(lab).join(", ")+")").join(" · ")}</p>`;
return h};
if(!RS0.length)h+='<p class="msg">Select at least one region in the top bar.</p>';else if(!(V.ov||V.mw||V.cp))h+='<p class="msg">Oopar filter bar mein months aur metrics chunen. Jo chunenge sirf wohi yahan dikhega.</p>';else if(S.vw=="r")RS0.forEach(r=>{h+=`<h2 class="rh">${r}</h2>`+secs([r])});else h+=secs(RS0);$("#s-dash").innerHTML=h}
function tbl(){const K=keys();let a="",b="",e="",et={};
K.forEach(k=>{const d=DB[k].r&&DB[k].r.Lahore||{};const row=(c)=>{const n=d.n,ok=n&&c!=null;return`<tr><td>${lab(k)}</td><td><input type="number" value="${n==null?"":n}" data-n="${k}" placeholder="NOP"></td><td>${c==null?"–":c}</td><td>${ok?Math.floor(n/c):"–"}</td></tr>`};
if(d.t!=null)a+=row(d.t);if(d.p!=null)b+=row(d.p);if(DB[k].e)Object.keys(DB[k].e).forEach(x=>et[x]=1)});
const T=(t,c,x)=>`<h2>${t}</h2><div class="wrap"><table><tr><th>Month</th><th>NOP</th><th>${c}</th><th>Ratio (1 : x)</th></tr>${x}</table></div>`;
const ets=Object.keys(et);
e=`<h2>Pre-analytical error types</h2><div class="wrap"><table><tr><th>Month</th>${ets.map(x=>`<th>${x}</th>`).join("")}</tr>`+K.filter(k=>DB[k].e).map(k=>`<tr><td>${lab(k)}</td>${ets.map(x=>`<td>${DB[k].e[x]||0}</td>`).join("")}</tr>`).join("")+"</table></div>";
$("#s-tb").innerHTML=T("Non-technical complaints (Lahore)","Complaints",a)+T("Pre-analytical errors (Lahore)","Error count",b)+e+`<div class="row"><button class="btn" id="csv">Download all data (CSV)</button><button class="btn" id="exp">Download data.js (for GitHub)</button><button class="btn" id="clr">Clear my local changes</button></div><p class="msg">New months you add are saved in THIS browser only. To make them visible to everyone: download data.js and replace it in your GitHub repository.</p><p class="msg">NOP is typed in once per month; ratio updates automatically.</p>`}
